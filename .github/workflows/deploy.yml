name: Deploy Pages

# Statische Seite, aber MIT einem Injektionsschritt: der Kontaktblock des
# Impressums (Name, Anschrift, Telefon, E-Mail) steht nicht im Repo, sondern im
# Secret IMPRESSUM_KONTAKT und wird hier eingesetzt. So landen die Daten nicht in
# Klons, Forks oder der Git-History.
#
# Einmalige Einrichtung (GitHub-Weboberflaeche):
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#      Name:  IMPRESSUM_KONTAKT
#      Wert:  der fertige HTML-Kontaktblock (Vorlage: imp/KONTAKT.beispiel.html)
#   2. Settings -> Pages -> Source: "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Kontaktdaten ins Impressum einsetzen
        env:
          IMPRESSUM_KONTAKT: ${{ secrets.IMPRESSUM_KONTAKT }}
        run: python3 .github/inject-kontakt.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
