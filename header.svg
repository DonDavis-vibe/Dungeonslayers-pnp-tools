<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 120" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dungeongewölbe mit Fackeln und einem W20">
  <!--
    Dekoratives Kopfbild für den Dungeonslayers-Charakterbogen.
    Bewusst kontrastarm gehalten: Darüber steht der Titel, der lesbar bleiben muss.
    Die Farben stammen aus der Palette in style.css (Grundton, Akzentgold, Blutrot).
  -->
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f14"/>
      <stop offset="0.55" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#120e0a"/>
    </linearGradient>

    <!-- Warmer Lichtschein der Fackeln -->
    <radialGradient id="fackelschein" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0c069" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#d4a24c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d4a24c" stop-opacity="0"/>
    </radialGradient>

    <!-- Tiefe des Gewölbes: mittig heller, zu den Rändern hin dunkel -->
    <radialGradient id="tiefe" cx="0.5" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>

    <linearGradient id="kante" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4a24c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d4a24c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#d4a24c" stop-opacity="0"/>
    </linearGradient>

    <!-- Mauerwerk als Kachel: versetzte Quader wie bei einem Verband -->
    <pattern id="mauer" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="none"/>
      <g stroke="#6b5232" stroke-opacity="0.30" stroke-width="1.5" fill="none">
        <path d="M0 0.75H80M0 20.75H80M0 39.25H80"/>
        <path d="M20 0.75V20.75M60 0.75V20.75M40 20.75V39.25M0 20.75V39.25M80 20.75V39.25"/>
      </g>
    </pattern>
  </defs>

  <!-- Grundfläche und Mauerwerk -->
  <rect width="1600" height="120" fill="url(#grund)"/>
  <rect width="1600" height="120" fill="url(#mauer)"/>

  <!-- Gewölbebögen, nach hinten kleiner werdend -->
  <g fill="none" stroke="#8a6a3e" stroke-linecap="round">
    <path d="M150 120V64a90 90 0 0 1 180 0v56" stroke-opacity="0.28" stroke-width="3"/>
    <path d="M1270 120V64a90 90 0 0 1 180 0v56" stroke-opacity="0.28" stroke-width="3"/>
    <path d="M600 120V52a200 200 0 0 1 400 0v68" stroke-opacity="0.20" stroke-width="3.5"/>
    <path d="M672 120V60a128 128 0 0 1 256 0v60" stroke-opacity="0.13" stroke-width="3"/>
  </g>

  <!-- W20 im Torbogen — dasselbe Motiv wie im Favicon -->
  <g transform="translate(800 74) scale(2.15)" fill="none" stroke="#d4a24c" stroke-linejoin="round">
    <path d="M0 -26 22.5 -13v26L0 26 -22.5 13v-26z" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M0 -26V26M-22.5 -13 22.5 13M22.5 -13-22.5 13" stroke-opacity="0.22" stroke-width="1.2"/>
    <path d="M0 -26-22.5 13 22.5 13z" stroke-opacity="0.34" stroke-width="1.4"/>
  </g>

  <!-- Gekreuzte Waffen hinter dem Würfel: Schwert und Streitaxt -->
  <g stroke-linecap="round" opacity="0.34">
    <g transform="translate(800 74) rotate(-32)">
      <path d="M-96 0H70" stroke="#9c8c74" stroke-width="4"/>
      <path d="M70 0 96 0" stroke="#9c8c74" stroke-width="2.5"/>
      <path d="M-96 -9V9" stroke="#8a6a3e" stroke-width="6"/>
      <path d="M-78 -12V12" stroke="#8a6a3e" stroke-width="5"/>
    </g>
    <g transform="translate(800 74) rotate(32)">
      <path d="M-96 0H84" stroke="#8a6a3e" stroke-width="5"/>
      <path d="M60 -26a34 34 0 0 1 0 52a54 54 0 0 0 0-52z" fill="#9c8c74" stroke="none"/>
    </g>
  </g>

  <!-- Fackeln links und rechts -->
  <g>
    <circle cx="255" cy="52" r="66" fill="url(#fackelschein)"/>
    <circle cx="1345" cy="52" r="66" fill="url(#fackelschein)"/>
    <g fill="#f0c069">
      <path d="M255 30c7 9 11 15 11 22a11 11 0 0 1-22 0c0-7 4-13 11-22z" opacity="0.85"/>
      <path d="M1345 30c7 9 11 15 11 22a11 11 0 0 1-22 0c0-7 4-13 11-22z" opacity="0.85"/>
    </g>
    <g fill="#a8342c" opacity="0.55">
      <path d="M255 40c4 5 6 9 6 13a6 6 0 0 1-12 0c0-4 2-8 6-13z"/>
      <path d="M1345 40c4 5 6 9 6 13a6 6 0 0 1-12 0c0-4 2-8 6-13z"/>
    </g>
    <g fill="#5a452a">
      <rect x="251" y="62" width="8" height="34" rx="3"/>
      <rect x="1341" y="62" width="8" height="34" rx="3"/>
    </g>
  </g>

  <!-- Tiefe und Abschlusskante -->
  <rect width="1600" height="120" fill="url(#tiefe)"/>
  <rect y="118" width="1600" height="2" fill="url(#kante)"/>
</svg>
